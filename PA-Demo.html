/* PA presentation layout: the paper matrix has room to breathe. */
:root{font-family:"Sarabun","Segoe UI",Tahoma,sans-serif;color:#1b3554;background:#f5f7fa;--navy:#1a3b61;--navy2:#173757;--line:#dfe7ef;--gold:#c9a55f}
.topbar{height:auto;min-height:58px;padding:10px 28px;border:0;background:#183a60;gap:24px}
.brand strong{font-size:16px;line-height:1.4}
.top-actions{gap:12px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}
.top-context{color:#e2eaf3}
.topbar .year{background:white;color:#193b60;border-color:white;font-weight:700;width:82px}
.top-actions button{border:1px solid #839bb4;padding:7px 11px}
.wrap{max-width:1880px;padding:25px 30px 55px}
.home-heading{text-align:center;padding:40px 0 22px}
.home-heading h1{font-size:30px;color:#163b64;margin:0 0 7px}
.home-heading p{font-size:13px;color:#71839a;margin:0}
.feature-grid{max-width:1190px;margin:0 auto;gap:22px}
.feature{align-items:center;text-align:center;min-height:210px;padding:29px 22px;border:0;border-radius:18px;box-shadow:0 10px 28px #18395e09}
.feature.primary{background:#fffaf0;border:1px solid #efe2c8}
.feature .icon{width:37px;height:37px;margin:0 0 20px;color:#27558a}
.feature h2{font-size:18px;margin-bottom:6px}
.feature p{font-size:12px;line-height:1.8;max-width:none}
.home-links{text-align:center;margin:24px auto}
.home-links button{font-size:12px}
.back-row{padding-bottom:12px;border-bottom:1px solid #dce4ed;margin:-5px 0 19px}
.back-row button{padding-left:0;color:#1f527f;font-weight:700}
.page-top{margin-bottom:20px;align-items:center}
.page-top h1{font-size:26px;color:#163b64;margin-bottom:2px}
.page-top p{font-size:12px}
.page-actions{gap:8px}
.workspace{display:block}
.section-nav{display:flex;justify-content:space-between;align-items:center;gap:10px 22px;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:14px}
.category-nav,.utility-nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.section-nav button{background:transparent;color:#4c6680;padding:8px 10px;font-size:12px;white-space:nowrap;border-radius:8px}
.section-nav button:hover{background:#eef3f8}
.section-nav button.current{background:#e8f0f7;color:#153e66;font-weight:700}
.section-nav .nav-num{border:0;background:#dce9f4;color:#2a5a86;width:21px;height:21px;border-radius:50%;font-size:11px;margin-right:5px}
.section-nav button.current .nav-num{background:#1b4b78;color:white}
.utility-nav{border-left:1px solid #e2e8ee;padding-left:12px}
.utility-nav button{font-size:11px}
.group-count{font-weight:400;color:#8294a6;background:#eff3f7}
.summary{position:static;margin-bottom:15px}
.score-inline{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-left:4px solid #caa65b;border-radius:10px;padding:12px 18px}
.score-inline-total{display:flex;gap:13px;align-items:baseline;min-width:215px}
.score-inline-total>span{font-size:11px;color:#71839a}
.score-inline-total output{font-size:25px;line-height:1;font-weight:700;color:#174675;white-space:nowrap}
.score-inline-total small{font-size:11px;color:#7e91a6}
.score-inline-parts{display:flex;gap:15px;font-size:11px;color:#667d93}
.score-inline-parts strong{display:block;color:#264a70;font-size:13px}
.score-inline-state{flex:1;font-size:12px;color:#446680}
.score-inline-state small{font-size:10px;color:#8b9cad}
.score-inline button{font-size:11px;padding:7px 10px;white-space:nowrap}
#editor{min-width:0}
.form-panel{padding:24px 28px}
.section-heading{margin-bottom:17px}
.section-heading h2{font-size:19px;margin:0 0 2px}
.section-tabs{margin-bottom:18px}
.section-tabs button{background:#f3f6f9;color:#496c8f;padding:8px 14px;font-size:12px}
.section-tabs button.active{background:#dceafa;color:#124471}
.form-columns,.work-item{display:grid;grid-template-columns:55px minmax(185px,1.1fr) minmax(205px,1.2fr) minmax(195px,1fr) minmax(170px,.95fr) minmax(215px,1.05fr);gap:0}
.form-columns.plan-columns,.work-item.plan-row{grid-template-columns:55px minmax(200px,1.3fr) minmax(230px,1.4fr) minmax(215px,1.25fr) minmax(205px,1fr)}
.form-columns{background:#eaf1f7;border:1px solid #cfdce9;border-bottom:0;border-radius:8px 8px 0 0;color:#21476e;font-size:12px;font-weight:700;text-align:center}
.form-columns span{padding:12px 8px;border-right:1px solid #cfdce9}
.form-columns span:last-child{border-right:0}
.work-item{margin:0;border:1px solid #cfdce9;border-top:0;border-radius:0;background:#fff;overflow:visible}
.work-item>div:not(.form-row-footer){padding:15px 13px;border-right:1px solid #e1e8ef;min-width:0}
.work-item>div:nth-last-child(2){border-right:0}
.work-item label{display:block;color:#557089;margin-bottom:12px}
.work-item input,.work-item select,.work-item textarea{font-size:12px;border-radius:5px;background:#fff;min-height:36px}
.work-item textarea{min-height:68px}
.work-item .form-ordinal{text-align:center;color:#1c4974;font-size:16px}
.form-ordinal small{display:block;font-size:9px;color:#8ca0b2;font-weight:400}
.form-conditions .check{display:flex}
.form-conditions .check input{width:auto;min-height:0;flex:0 0 auto}
.result-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.result-pair>div{background:#eff5f9;border:1px solid #dde7ef;border-radius:6px;padding:7px;text-align:center}
.result-pair output{display:block;font-size:19px;font-weight:700;color:#165b79;min-height:31px}
.result-pair .auto-label{font-size:9px;color:#69849a}
.result-pair .lock{font-size:8px}

.advance-main-summary{grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:center}
#ap-main-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(84px,auto);gap:10px;min-width:0;overflow:visible}
.advance-card{padding:12px 16px;min-height:84px;gap:4px;align-content:center}
.advance-card>span{font-size:15px;line-height:1.4}
.advance-card>span:last-child:not(:first-child){font-size:14px}
.advance-card strong{font-size:21px;line-height:1.25}
.advance-chart-summary{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:10px}
.advance-pie{width:112px;height:112px}
#ap-pie-legend p{font-size:12px;line-height:1.4;margin:4px 0}
.impact-entry-group{padding:13px 14px;margin:10px 0;border:1px solid #d8e5ec;border-radius:8px;background:#fbfdff}
.impact-entry-heading{margin:0 0 10px;color:#173d65;font-size:15px;font-weight:700}
.impact-level-description{margin:7px 0 12px;padding:8px 10px;border-left:3px solid #80bfa9;border-radius:4px;background:#f0f7f3;color:#45665c;font-size:14px;line-height:1.55}
.research-selected-fullname{margin-top:8px;color:#425c70;font-size:14px;line-height:1.5}
.research-single-workload{display:grid;gap:6px;padding:11px 12px;border:1px solid #d8e5ec;border-radius:7px;background:#f7fafc;color:#536c7c;font-size:14px}
.research-single-workload strong{color:#173d65;font-weight:650}
@media(max-width:900px){.advance-main-summary{grid-template-columns:1fr}.advance-chart-summary{grid-template-columns:160px minmax(0,1fr);justify-content:center}.advance-pie{width:150px;height:150px}}
@media(max-width:560px){#ap-main-cards{grid-template-columns:1fr}.advance-chart-summary{grid-template-columns:1fr;justify-items:center}.advance-pie{width:120px;height:120px}.language-toggle{padding:6px 9px}}


/* Distinguish the overall PA summary from the main-work chart below. */
.advance-scorebar.sketch-summary{--top-strategy:#927fad;--top-main:#718eaa;--top-assigned:#bd9551;--top-community:#b77970}
.advance-four-weights .advance-weight-cell{border:1px solid #dce3ea;border-radius:9px;padding:10px 8px;background:#f8fafc;gap:7px;justify-content:space-between}
.advance-four-weights .advance-weight-cell:nth-child(1){background:#f1eef6;border-color:#d8cfe6}
.advance-four-weights .advance-weight-cell:nth-child(2){background:#edf2f6;border-color:#d0dce6}
.advance-four-weights .advance-weight-cell:nth-child(3){background:#f8f2e7;border-color:#e8dbc0}
.advance-four-weights .advance-weight-cell:nth-child(4){background:#f7eeed;border-color:#e7d3d0}
.advance-four-weights .advance-weight-cell:nth-child(1)>strong,.advance-four-weights .advance-weight-cell:nth-child(1) output{color:var(--top-strategy)}
.advance-four-weights .advance-weight-cell:nth-child(2)>strong,.advance-four-weights .advance-weight-cell:nth-child(2) output{color:var(--top-main)}
.advance-four-weights .advance-weight-cell:nth-child(3)>strong,.advance-four-weights .advance-weight-cell:nth-child(3) output{color:var(--top-assigned)}
.advance-four-weights .advance-weight-cell:nth-child(4)>strong,.advance-four-weights .advance-weight-cell:nth-child(4) output{color:var(--top-community)}
.advance-four-weights .advance-weight-cell>span{color:#42596d}
.advance-four-weights .advance-weight-cell output{border-top-color:#d7dfe6;padding-top:7px}
@media(max-width:600px){.advance-four-weights .advance-weight-cell{padding:8px 5px}}

/* Final overrides: subdued research-level help and clearly paired chart/card palettes. */
.advance-scorebar.sketch-summary{--top-strategy:#76659b;--top-main:#4e7894;--top-assigned:#b68032;--top-community:#b6685c;--top-teaching:#4b9bb8;--top-research:#c06a91;--top-service:#5d956f}
.advance-four-weights .advance-weight-cell:nth-child(1){background:#b5e3fa;border-color:#d9d3e5}
.advance-four-weights .advance-weight-cell:nth-child(2){background:#ebfae5;border-color:#d2dfe5}
.advance-four-weights .advance-weight-cell:nth-child(3){background:#f7f1e6;border-color:#e8ddc8}
.advance-four-weights .advance-weight-cell:nth-child(4){background:#facaa7;border-color:#e8d5d1}fbc095
.advance-card.teaching{background:#edf5f7;border-color:#d1e5eb}
.advance-card.research{background:#f7eef2;border-color:#ead5df}
.advance-card.service{background:#eff5f0;border-color:#d7e6d9}
#ap-pie-legend .teaching:before{background:#4b9bb8}
#ap-pie-legend .research:before{background:#c06a91}
#ap-pie-legend .service:before{background:#5d956f}
.advance-card.main-total-card{background:#fff;border:2px solid #4e7894;box-shadow:0 7px 20px #183a5524,inset 0 4px 0 #4e7894;position:relative}
.advance-card.main-total-card:before{content:'';position:absolute;left:0;right:0;top:0;height:5px;border-radius:8px 8px 0 0;background:#4e7894}
.advance-card.main-total-card strong{font-size:27px;color:#244c68}
.impact-level-description{margin:5px 0 12px;padding:0;border:0;border-radius:0;background:transparent;color:#687785;font-size:14px;line-height:1.55}
</style></head>

bel":"โครงการของหลักสูตร และรายวิชาในหลักสูตร","meaning":"คณะกรรมการดำเนินโครงการเพื่อส่งเสริมและพัฒนาทักษะของนักศึกษาตามวัตถุประสงค์ของหลักสูตร","kind":"hours","category":"main","area":"teaching","source":"A04 ตารางไฟล์ 16","rate":3},{"id":"research_process","rule_id":"research_process","label":"กระบวนการวิจัย","meaning":"งานวิจัย คือ ผลงานทางวิชาการที่เป็นงานศึกษาหรืองานค้นคว้าอย่างมีระบบด้วยวิธีวิทยาการวิจัยที่เป็นที่ยอมรับในสาขาวิชานั้น ๆ และมีวัตถุประสงค์ที่ชัดเจนเพื่อให้ได้มาซึ่งข้อมูล คำตอบหรือข้อสรุปรวมที่จะนำไปสู่ความ ก้าวหน้าทางวิชาการ หรือเอื้อต่อการนำวิชาการนั้นไปประยุกต์ รวมถึงงานวิจัยในชั้นเรียน\nงานวิจัยที่จะใช้มาเป็นผลงาน ต้องเป็นโครงการวิจัยที่ผ่านระบบของมหาวิทยาลัย มหิดล และหรือโครงการที่ได้รับความเห็นชอบของคณะสังคมศาสตร์และมนุษยศาสตร์ อย่างเป็นทางการ ทั้งที่เป็นโครงการวิจัยที่ได้รับทุนวิจัย หรือโครงการวิจัยที่ดำเนินการให้กับหน่วยงานราชการ ตามสัญญาจ้างที่ปรึกษา\nการนับระยะเวลาดำเนินงาน เริ่มตั้งแต่ช่วงพัฒนาโครงร่าง/ข้อเสนอโครงการวิจัย (Research proposal) จนถึงช่วงได้ร่างรายงานขั้นสุดท้าย (Draft final report)","kind":"process","category":"main","area":"research","source":"A02 ตารางที่ 11 และ 14","family":"main","branch":"process"},{"id":"research_output","rule_id":"research_output","label":"ผลลัพธ์การวิจัยที่มีการเผยแพร่","meaning":"การเผยแพร่ผลงานวิจัยตามเอกสารแนบท้ายประกาศ ก.พ.อ. เรื่องหลักเกณฑ์และวิธีการพิจารณาแต่งตั้งบุคคลให้ดำรงตำแหน่งผู้ช่วยศาสตราจารย์ รองศาสตราจารย์ และ ศาสตราจารย์ พ.ศ. 2564 ได้กล่าวถึงการเผยแพร่ผลการวิจัยไว้ 5 รูปแบบ คือ 1) เผยแพร่ในวารสารทางวิชาการ 2) เผยแพร่ในหนังสือรวมบทความวิจัยในรูปแบบอื่นที่มีการบรรณาธิการประเมินและตรวจสอบคุณภาพ 3) การเผยแพร่ในหนังสือประมวลผลการประชุมทางวิชาการ (Proceedings) ของการประชุมทางวิชาการระดับชาติหรือนานาชาติ 4) เผยแพร่รายงานฉบับสมบูรณ์ที่มีหลักฐานว่าผ่านการประเมินคุณภาพโดยผู้ทรงคุณวุฒิและมีหลักฐานว่าได้เผยแพร่ไปยังวงวิชาการและวิชาชีพอย่างกว้างขวาง และ 5) เผยแพร่     ในรูปของหนังสือ (monograph) พร้อมหลักฐานว่าได้เผยแพร่ไปยังวงวิชาการและวิชาชีพในสาขาวิชานั้น     และสาขาวิชาที่เกี่ยวข้องอย่างกว้ function uiProtected(node){const parent=node.parentElement;if(parent?.closest('option')&&!parent.closest('select[data-ap="_research_category"]'))return true;return !!parent?.closest('.advance-meaning,.advance-notes,.research-context,.research-selected-fullname,.advance-work-assessment,.workload-formula,.source-info,.research-rule-note,.paper-form,.reference-table,.scoring-explainer')}

function applyLanguage(root=document.body){if(!root)return;const nodes=[];if(root.nodeType===Node.TEXT_NODE)nodes.push(root);else if(root.nodeType===Node.ELEMENT_NODE){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode())nodes.push(walker.currentNode)}for(const node of nodes){if(uiProtected(node))continue;if(!uiOriginals.has(node))uiOriginals.set(node,node.nodeValue);const original=uiOriginals.get(node);node.nodeValue=uiLanguage==='en'?uiTranslate(original):original}if(root.nodeType===Node.TEXT_NODE)return;const elements=root.nodeType===Node.ELEMENT_NODE?[root,...root.querySelectorAll('input,textarea,button,[title],[aria-label]')]:[];for(const element of elements){for(const attr of ['placeholder','title','aria-label'])if(element.hasAttribute?.(attr)){let original=element.getAttribute('data-ui-original-'+attr);if(original===null){original=element.getAttribute(attr);element.setAttribute('data-ui-original-'+attr,original)}if(element.closest?.('.source-info,.advance-meaning,.advance-notes'))continue;element.setAttribute(attr,uiLanguage==='en'?uiTranslate(original):original)}if(element.matches?.('option')&&element.closest('select[data-ap="_research_category"]')){if(!uiOriginals.has(element))uiOriginals.set(element,element.textContent);(()=>{const translated=uiLanguage==='en'?uiTranslate(uiOriginals.get(element)):uiOriginals.get(element);if(element.textContent!==translated)element.textContent=translated})()}}const toggle=document.getElementById('language-toggle');if(toggle){const label=uiLanguage==='en'?'ไทย':'EN';if(toggle.textContent!==label)toggle.textContent=label;toggle.setAttribute('aria-label',uiLanguage==='en'?'Switch to Thai':'Switch to English');toggle.title=uiLanguage==='en'?'Switch to Thai':'Switch to English'}document.documentElement.lang=uiLanguage}
function setLanguage(){uiLanguage=uiLanguage==='en'?'th':'en';try{localStorage.setItem('pa-ui-language',uiLanguage)}catch(_){/* Continue even when local storage is blocked. */}applyLanguage(document.body)}

async function upload(id,file){if(!file)return;try{if(!online)throw Error('การแนบไฟล์ยังไม่พร้อมใช้งานในหน้านี้');if(file.size>5*1024*1024)throw Error('ไฟล์ใหญ่กว่า 5 MB');const x=doc().items.find(x=>x.id===id)||placeholderRows.get(id);if(x?.placeholder){delete x.placeholder;doc().items.push(x);placeholderRows.delete(id)}if(x.evidence_ids.length>=3)throw Error('แนบได้ไม่เกิน 3 ไฟล์ต่อรายการ');await save(true);const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(Error('อ่านไฟล์ไม่ได้'));reader.readAsDataURL(file)});const f=await api('/upload',{mode:'actual',item_id:id,name:file.name,mime:file.type,content});files.push(f);x.evidence_ids.push(f.id);await save(true);if(view==='actual'&&!PAPaper.legacy)PAPaper.workspace();else itemEditor();updateCalculation();toast('แนบไฟล์หลักฐานแล้ว')}catch(error){toast(error.message,true)}}

function sourceDate(value){const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!match)return '';const year=Number(match[1])>2400?Number(match[1])-543:Number(match[1]);const iso=`${year}-${match[2]}-${match[3]}`;return Number.isFinite(Date.parse(iso))?iso:''}
