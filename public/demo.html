<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PA Admin Backend</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --ink: #17395c;
        --muted: #627c97;
        --line: #dfe7f2;
        --primary: #1f5c8c;
        --primary-soft: #eaf4ff;
        --danger: #c84f4f;
        --success: #1c8a6c;
        --shadow: 0 10px 25px rgba(18, 40, 66, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .topbar {
        background: linear-gradient(180deg, #163b60, #102b46);
        color: white;
        padding: 18px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 18px rgba(16, 32, 49, 0.18);
      }
      .topbar h1 { margin: 0; font-size: 1.25rem; }
      .topbar .links {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .topbar a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 999px;
        padding: 8px 14px;
      }
      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 24px;
        max-width: 1400px;
        margin: 24px auto;
        padding: 0 20px 40px;
      }
      .sidebar, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }
      .sidebar {
        padding: 18px;
      }
      .sidebar h2 {
        margin-top: 0;
        font-size: 1rem;
      }
      .section-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }
      .section-item {
        width: 100%;
        border: 1px solid var(--line);
        background: white;
        padding: 12px 14px;
        border-radius: 12px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        cursor: pointer;
      }
      .section-item.active {
        background: var(--primary-soft);
        border-color: rgba(31, 92, 140, 0.45);
        font-weight: 700;
      }
      .add-btn, .save-btn, .delete-btn {
        font: inherit;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        padding: 10px 14px;
        font-weight: 700;
      }
      .add-btn { background: var(--primary); color: white; }
      .save-btn { background: var(--success); color: white; }
      .delete-btn { background: var(--danger); color: white; }
      .panel {
        padding: 20px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }
      .toolbar h2 { margin: 0; font-size: 1.25rem; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
        background: white;
      }
      .field textarea {
        min-height: 90px;
        resize: vertical;
      }
      .full { grid-column: 1 / -1; }
      .option-box {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .option-box-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .option-box-header h3 { margin: 0; }
      .option-list {
        display: grid;
        gap: 14px;
      }
      .option-card {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fbfcff;
        padding: 14px;
      }
      .option-grid {
        display: grid;
        grid-template-columns: 1.1fr 1fr 1.4fr 80px;
        gap: 12px;
      }
      .option-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .mini-btn {
        font: inherit;
        padding: 8px 10px;
        border-radius: 8px;
        border: 0;
        background: var(--danger);
        color: white;
        cursor: pointer;
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .grid,
        .option-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1 id="app-name">PA Admin Backend</h1>
      <div class="links">
        <a href="/">Admin</a>
        <a href="/demo" target="_blank" rel="noreferrer">Open Demo</a>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>เมนูหัวข้อ</h2>
        <div id="section-list" class="section-list"></div>
        <div style="margin-top: 16px;">
          <button id="new-section" class="add-btn">+ เพิ่มหัวข้อใหม่</button>
        </div>
      </aside>

      <section class="panel">
        <div class="toolbar">
          <h2 id="form-title">รายละเอียดหัวข้อ</h2>
          <div style="display:flex; gap:12px; align-items:center;">
            <button id="save-section" class="save-btn">บันทึกข้อมูล</button>
            <button id="delete-section" class="delete-btn">ลบหัวข้อ</button>
          </div>
        </div>

        <div id="editor"></div>
      </section>
    </main>

    <script>
      const state = {
        sections: [],
        selectedId: null
      };

      function renderSectionList() {
        const container = document.getElementById('section-list');
        container.innerHTML = '';

        state.sections.forEach((section) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `section-item ${String(section.id) === String(state.selectedId) ? 'active' : ''}`;
          btn.textContent = section.title || 'Untitled section';
          btn.addEventListener('click', () => {
            state.selectedId = section.id;
            render();
          });
          container.appendChild(btn);
        });
      }

      function renderEditor() {
        const section = state.sections.find((item) => String(item.id) === String(state.selectedId));
        const editor = document.getElementById('editor');

        if (!section) {
          editor.innerHTML = '<p>ไม่พบหัวข้อที่เลือก</p>';
          return;
        }

        document.getElementById('form-title').textContent = section.title || 'รายละเอียดหัวข้อ';

        const optionsHtml = (section.options || []).map((option, index) => `
          <div class="option-card" data-option-id="${option.id || index}">
            <div class="option-grid">
              <div class="field">
                <label>ชื่อตัวเลือก</label>
                <input data-role="option-label" value="${escapeHtml(option.label || '')}" />
              </div>
              <div class="field">
                <label>ค่า (value)</label>
                <input data-role="option-value" value="${escapeHtml(option.value || '')}" />
              </div>
              <div class="field">
                <label>คำอธิบาย</label>
                <input data-role="option-description" value="${escapeHtml(option.description || '')}" />
              </div>
              <div class="field">
                <label>ลบ</label>
                <button class="mini-btn" type="button" data-role="remove-option">ลบ</button>
              </div>
            </div>
          </div>
        `).join('');

        editor.innerHTML = `
          <div class="grid">
            <div class="field">
              <label>ชื่อหัวข้อ</label>
              <input id="section-title" value="${escapeHtml(section.title || '')}" />
            </div>
            <div class="field">
              <label>Slug</label>
              <input id="section-slug" value="${escapeHtml(section.slug || '')}" />
            </div>
            <div class="field full">
              <label>คำอธิบาย</label>
              <textarea id="section-description">${escapeHtml(section.description || '')}</textarea>
            </div>
            <div class="field">
              <label>ลำดับ</label>
              <input id="section-order" type="number" value="${Number(section.sortOrder || 0)}" />
            </div>
          </div>

          <div class="option-box">
            <div class="option-box-header">
              <h3>รายการตัวเลือก</h3>
              <button type="button" id="add-option" class="add-btn">+ เพิ่มตัวเลือก</button>
            </div>
            <div class="option-list">${optionsHtml || '<p>ยังไม่มีตัวเลือก</p>'}</div>
          </div>
        `;

        document.getElementById('add-option').addEventListener('click', () => {
          const target = state.sections.find((item) => String(item.id) === String(state.selectedId));
          if (!target.options) target.options = [];
          target.options.push({
            id: Date.now() + Math.random(),
            label: 'ตัวเลือกใหม่',
            value: 'new-option',
            description: 'คำอธิบาย'
          });
          render();
        });

        document.querySelectorAll('[data-role="remove-option"]').forEach((button) => {
          button.addEventListener('click', () => {
            const card = button.closest('.option-card');
            const optionId = card?.dataset.optionId;
            const target = state.sections.find((item) => String(item.id) === String(state.selectedId));
            target.options = (target.options || []).filter((option) => String(option.id) !== String(optionId));
            render();
          });
        });
      }

      function getDirtySection() {
        const section = state.sections.find((item) => String(item.id) === String(state.selectedId));
        if (!section) return null;

        const title = document.getElementById('section-title').value.trim();
        const slug = document.getElementById('section-slug').value.trim();
        const description = document.getElementById('section-description').value.trim();
        const sortOrder = Number(document.getElementById('section-order').value || 0);
        const rawOptions = Array.from(document.querySelectorAll('.option-card')).map((card, index) => {
          const label = card.querySelector('[data-role="option-label"]').value.trim();
          const value = card.querySelector('[data-role="option-value"]').value.trim();
          const descriptionText = card.querySelector('[data-role="option-description"]').value.trim();
          return {
            id: card.dataset.optionId ? Number(card.dataset.optionId) || card.dataset.optionId : Date.now() + index,
            label,
            value,
            description: descriptionText
          };
        });

        return {
          ...section,
          title,
          slug,
          description,
          sortOrder,
          options: rawOptions
        };
      }

      async function saveCurrentSection() {
        const section = getDirtySection();
        if (!section) return;

        const method = section.id ? 'PUT' : 'POST';
        const url = section.id ? `/api/sections/${section.id}` : '/api/sections';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(section)
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.message || 'Unable to save');
        }

        await loadSections();
        state.selectedId = payload.section.id;
        render();
      }

      async function deleteCurrentSection() {
        const section = state.sections.find((item) => String(item.id) === String(state.selectedId));
        if (!section) return;

        const ok = confirm(`ต้องการลบหัวข้อ "${section.title}" หรือไม่`);
        if (!ok) return;

        const response = await fetch(`/api/sections/${section.id}`, { method: 'DELETE' });
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload.message || 'Unable to delete');
        }

        await loadSections();
        state.selectedId = state.sections[0]?.id || null;
        render();
      }

      async function createNewSection() {
        const nextSection = {
          id: Date.now(),
          title: 'หัวข้อใหม่',
          slug: `section-${Date.now()}`,
          description: 'คำอธิบายหัวข้อ',
          sortOrder: state.sections.length + 1,
          options: [{
            id: Date.now() + 1,
            label: 'ตัวเลือกใหม่',
            value: 'new-option',
            description: 'คำอธิบายตัวเลือก'
          }]
        };

        state.sections.push(nextSection);
        state.selectedId = nextSection.id;
        render();
      }

      async function loadSections() {
        const response = await fetch('/api/sections');
        const payload = await response.json();
        state.sections = payload.sections || [];
        if (!state.selectedId && state.sections[0]) state.selectedId = state.sections[0].id;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function render() {
        renderSectionList();
        renderEditor();
      }

      async function init() {
        try {
          await loadSections();
          document.getElementById('new-section').addEventListener('click', createNewSection);
          document.getElementById('save-section').addEventListener('click', () => {
            saveCurrentSection().catch((error) => alert(error.message));
          });
          document.getElementById('delete-section').addEventListener('click', () => {
            deleteCurrentSection().catch((error) => alert(error.message));
          });
          render();
          const response = await fetch('/api/config');
          const payload = await response.json();
          if (payload.appName) {
            document.getElementById('app-name').textContent = payload.appName;
          }
        } catch (error) {
          alert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + error.message);
        }
      }

      init();
    </script>
  </body>
</html>
