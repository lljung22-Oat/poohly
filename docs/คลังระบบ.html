<head>

    :root { --ink:#1a2744; --navy:#1e3a5f; --line:#c9d4e4; --bg:#f4f1ea; --card:#fff; --miss:#8a1c1c; --ok:#1b4d3e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Sarabun", "Thonburi", sans-serif; font-size: 22px; line-height: 1.55; }
    body { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    nav { background: var(--navy); color: #fff; padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    nav h1 { font-size: 26px; margin: 0 0 16px; line-height: 1.3; }
    nav button { display: block; width: 100%; text-align: left; background: transparent; color: #fff; border: 0; border-bottom: 1px solid rgba(255,255,255,.15); padding: 14px 8px; font-size: 20px; cursor: pointer; }
    nav button.on { background: #c9a227; color: #1a1404; font-weight: 700; }
    main { padding: 28px 36px 80px; max-width: 1100px; }
    h2 { font-size: 36px; margin: 0 0 16px; }
    h3 { font-size: 28px; margin: 28px 0 12px; }
    p, li { font-size: 22px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); margin: 12px 0 24px; }
    th, td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; font-size: 20px; }
    th { background: #e8eef6; }
    .card { background: var(--card); border: 1px solid var(--line); padding: 18px 20px; margin: 0 0 18px; }
    .miss { color: var(--miss); font-weight: 700; }
    .ok { color: var(--ok); font-weight: 700; }
    .hide { display: none; }
    code { font-size: 18px; background: #eee8d8; padding: 0 6px; }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      nav { height: auto; position: relative; }
    }
  </style>
</head>
